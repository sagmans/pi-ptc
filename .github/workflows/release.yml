name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          minimum_release_age: 7d

      - run: npm ci --ignore-scripts

      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # One job owns release bytes so every later gate sees the same archive.
      - name: Pack artifact
        run: |
          mkdir -p artifact
          npm pack --pack-destination artifact

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          minimum_release_age: 7d

      - run: npm ci --ignore-scripts
      - run: npm run verify:ci
      - run: npm run test:bun

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact

      - name: Load verified artifact through Pi
        run: |
          set -- artifact/*.tgz
          test "$#" -eq 1 && test -f "$1"
          package="$PWD/$1"
          npm run smoke -- --tarball "$package"

  publish:
    needs: [package, verify]
    # npm trust can only be configured after the one-time manual bootstrap.
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact

      - name: Publish verified artifact
        run: |
          set -- artifact/*.tgz
          test "$#" -eq 1 && test -f "$1"
          package="$PWD/$1"
          npm publish "$package" --provenance --access public
